<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>工程規格需求表 Demo 示範版</title>
<style>
:root{
  --blue:#0054A7; --sky:#008CD6; --green:#009C42; --pale:#D3EDFB; --pale2:#EAF2F9;
  --ink:#3E3A39; --line:#D9E4EE; --bg:#F5F8FB; --card:#FFFFFF; --muted:#6F7A85;
  --gray:#F2F4F6; --gray-line:#C9D1D9; --warn:#C23B22; --warn-bg:#FDF1EE;
  --green-bg:#E5F5EC; --sky-bg:#E6F4FB; --no-bg:#EEF0F2;
  --radius:12px;
  --font:"Microsoft JhengHei","微軟正黑體","PingFang TC","Noto Sans TC",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;overflow-wrap:anywhere}
button,input,textarea,select{font:inherit;color:inherit}
[hidden]{display:none!important}
a{color:var(--blue)}
:focus-visible{outline:3px solid var(--sky);outline-offset:2px}

/* 頁首 */
.topbar{position:sticky;top:0;z-index:30;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:10px 24px;flex-wrap:wrap}
.topbar .logo{height:34px;width:auto;display:block;flex:none}
.tb-title{flex:1 1 220px;min-width:0}
.form-name{font-weight:700;color:var(--blue);font-size:17px;line-height:1.3}
.form-sub{font-size:13px;color:var(--muted)}
.tb-actions{display:flex;gap:8px;flex:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:44px;padding:8px 18px;border-radius:10px;border:1.5px solid var(--line);background:#fff;color:var(--blue);font-weight:600;cursor:pointer;text-decoration:none}
.btn:hover{border-color:var(--sky)}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.btn.primary:hover{background:#00468C}
.btn.good{background:var(--green);border-color:var(--green);color:#fff}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{min-height:36px;padding:4px 12px;font-size:14px}
.btn.lg{min-height:52px;padding:10px 24px;font-size:17px}
.banner{margin:12px auto 0;max-width:1180px;padding:10px 16px;border-radius:10px;border:1px solid var(--line);background:var(--pale2);font-size:15px}
.banner.warn{background:var(--warn-bg);border-color:#F2C9BF;color:var(--warn)}
main{max-width:1180px;margin:0 auto;padding:20px 24px 80px}
.site-foot{text-align:center;font-size:12px;color:var(--muted);padding:16px 16px 28px}

/* 首頁 */
.hero{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:24px 28px}
.hero h1{margin:0 0 4px;font-size:26px;color:var(--blue);line-height:1.35}
.hero .ver{display:inline-block;margin-left:8px;font-size:14px;color:var(--sky);font-weight:600;vertical-align:middle}
.hero p{margin:6px 0 0;font-size:14.5px}
.hero .notes{margin:12px 0 0;padding-left:20px;font-size:14px;color:var(--muted)}
.h2{font-size:19px;color:var(--blue);margin:28px 0 12px;font-weight:700}
.flow{display:flex;gap:10px;list-style:none;margin:0;padding:0}
.flow li{flex:1 1 0;min-width:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 10px 12px;position:relative}
.flow li .fid{display:inline-block;font-weight:700;color:var(--sky);font-size:13px}
.flow li .fname{font-weight:700;font-size:14.5px;line-height:1.35;margin:2px 0 4px;color:var(--ink)}
.flow li .fowner{font-size:12.5px;color:var(--muted);line-height:1.4}
.flow li .cond{display:inline-block;margin-left:6px;font-size:12px;color:var(--sky);border:1px solid var(--sky);border-radius:999px;padding:0 7px}
.flow li.is-cond{border-style:dashed;border-color:var(--sky)}
.cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.role-card{display:flex;flex-direction:column;gap:6px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:var(--radius);padding:22px 22px 20px;cursor:pointer;min-height:170px}
.role-card:hover{border-color:var(--sky);box-shadow:0 4px 14px rgba(0,84,167,.08)}
.role-card .rc-tag{font-size:13px;color:var(--sky);font-weight:700}
.role-card .rc-title{font-size:20px;font-weight:700;color:var(--blue);line-height:1.35}
.role-card .rc-desc{font-size:14.5px;color:var(--ink);flex:1}
.role-card .rc-go{font-size:14.5px;color:var(--blue);font-weight:700}
.role-card[data-role-card="U"]{background:linear-gradient(180deg,#fff, var(--pale2));border-color:#BFD9EE}
.home-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;align-items:center}
.file-btn input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.file-btn:focus-within{outline:3px solid var(--sky);outline-offset:2px}
.home-msg{margin-top:12px;min-height:1.6em;font-size:15px}
.home-msg.warn{color:var(--warn)}
.case-chip{display:inline-block;background:var(--green-bg);color:#00692C;border-radius:999px;padding:3px 12px;font-size:14px}

/* 精靈 */
.wiz{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:24px;align-items:start}
.wiz-main{min-width:0}
.progress{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin-bottom:16px}
.progress-top{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
#wizProgress{font-weight:700;color:var(--blue);font-size:18px}
.progress-bar{height:8px;background:var(--pale2);border-radius:999px;margin-top:10px;overflow:hidden}
.progress-bar span{display:block;height:100%;background:var(--sky);border-radius:999px;transition:width .2s}
.stepper{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.stepper button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:2px 10px;font-size:13px;cursor:pointer;color:var(--muted)}
.stepper button.cur{border-color:var(--blue);color:var(--blue);font-weight:700}
.stepper button.done{color:var(--green);border-color:#A9DCBD}
.step-head h2{margin:0;font-size:22px;color:var(--blue)}
.step-head p{margin:4px 0 16px;color:var(--muted)}
.wiz-nav{display:flex;justify-content:space-between;gap:12px;margin-top:20px}
.wiz-nav .btn{flex:0 1 270px}
.return-banner{background:var(--warn-bg);border:1px solid #F2C9BF;color:var(--warn);border-radius:10px;padding:10px 14px;margin-bottom:14px}

/* 欄位 */
.field{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px 18px;margin-bottom:12px;min-width:0}
.field.is-off{display:none}
.field.err{border-color:var(--warn);background:var(--warn-bg)}
.field > label.fl, .field legend.fl{display:block;font-weight:700;font-size:16.5px;margin:0 0 6px;padding:0;color:var(--ink)}
fieldset{border:0;margin:0;padding:0;min-width:0}
.req{display:inline-block;font-size:12px;font-weight:600;color:var(--warn);border:1px solid #EBB5A8;border-radius:999px;padding:0 7px;margin-left:6px;vertical-align:2px}
.sopref{font-size:12px;color:var(--muted);font-weight:400;margin-left:6px}
.help{font-size:14px;color:var(--muted);margin:-2px 0 8px}
.errmsg{display:none;font-size:14px;color:var(--warn);margin-top:6px}
.field.err .errmsg{display:block}
.inp{width:100%;min-height:46px;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
textarea.inp{min-height:96px;resize:vertical}
.inp:focus{border-color:var(--sky);outline:none;box-shadow:0 0 0 3px rgba(0,140,214,.18)}
.num-wrap{display:flex;align-items:center;gap:8px;max-width:280px}
.num-wrap .unit{flex:none;color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{position:relative;display:flex;align-items:center;gap:10px;min-height:48px;padding:10px 16px 10px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;max-width:100%;line-height:1.4}
.chip input{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.chip .mark{flex:none;width:20px;height:20px;border:2px solid var(--gray-line);border-radius:6px;background:#fff;display:inline-flex;align-items:center;justify-content:center}
.chip.radio .mark{border-radius:50%}
.chip:hover{border-color:var(--sky)}
.chip:focus-within{outline:3px solid var(--sky);outline-offset:2px}
.chip.on{border-color:var(--blue);background:var(--pale2);color:var(--blue);font-weight:600}
.chip.on .mark{border-color:var(--blue);background:var(--blue)}
.chip.on .mark::after{content:"";width:8px;height:8px;border-radius:2px;background:#fff}
.chip.radio.on .mark::after{border-radius:50%}
.counts{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px}
.counts .ci label{display:block;font-size:14.5px;margin-bottom:4px}
.sig{display:grid;gap:10px}
.sig .sig-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.sig .sig-row label{flex:none;font-size:14.5px}
.sig .sig-row .inp{flex:1 1 160px;max-width:320px}
.sig-pad{display:block;width:100%;max-width:520px;aspect-ratio:600/180;height:auto;border:1.5px dashed var(--gray-line);border-radius:10px;background:#fff;touch-action:none;cursor:crosshair}
.sig-foot{display:flex;gap:12px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.badge{display:inline-block;font-size:12.5px;font-weight:600;border-radius:999px;padding:1px 10px;margin-left:8px;vertical-align:2px}
.badge.auto{background:var(--sky-bg);color:var(--sky)}
.badge.override{background:#FFF4E0;color:#9A5B00}
.badge-wrap{display:inline}
.restore{font-size:12.5px;margin-left:6px;background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;padding:0}
.matrix{display:grid;gap:10px}
.mrow{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#fff}
.mrow legend{font-weight:600;font-size:15px;padding:0;margin-bottom:6px}
.mrow .chips{gap:8px}
.mrow .chip{min-height:40px;padding:6px 12px 6px 10px}
.mrow .inp{margin-top:8px;min-height:40px}
.rule-note{margin-top:8px;font-size:14px;color:var(--sky)}

/* 流程預判 */
.predict{position:sticky;top:76px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:16px 16px 12px;max-height:calc(100vh - 96px);overflow:auto}
.predict-toggle{display:none}
.predict h3{margin:0 0 4px;font-size:18px;color:var(--blue)}
.predict .p-intro{font-size:13px;color:var(--muted);margin:0 0 10px}
.prule{border-top:1px solid var(--line);padding:10px 0}
.prule .pr-head{display:flex;justify-content:space-between;gap:8px;align-items:center}
.prule .pr-name{font-weight:700;font-size:14.5px}
.prule .pr-text{font-size:14px;margin-top:3px}
.prule .pr-basis{font-size:12.5px;color:var(--muted);margin-top:2px}
.pill{flex:none;display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 10px;white-space:nowrap}
.pill.yes{background:var(--green-bg);color:var(--green)}
.pill.no{background:var(--no-bg);color:#8A949E}
.pill.unknown{background:var(--sky-bg);color:var(--sky)}
.pflow{list-style:none;margin:6px 0 0;padding:0;border-top:1px solid var(--line)}
.pflow li{padding:7px 0;border-bottom:1px dashed var(--line)}
.pflow .pf-head{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:14px}
.pflow .pf-head b{color:var(--sky);margin-right:4px}
.pflow li[data-state="no"] .pf-head{color:#9AA3AC}
.pflow .pf-sub{font-size:12.5px;color:var(--muted);margin-top:2px}
.p-fine{font-size:12.5px;color:var(--muted);margin:10px 0 0}

/* 摘要 */
.review-sec{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:14px 18px;margin-bottom:12px}
.review-sec h3{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:0 0 8px;font-size:17px;color:var(--blue)}
.kv{display:grid;grid-template-columns:minmax(120px,34%) minmax(0,1fr);gap:4px 14px;margin:0}
.kv dt{color:var(--muted);font-size:14.5px}
.kv dd{margin:0;font-size:15px;white-space:pre-wrap}
.kv dd.empty{color:#A3ACB5}
.kv dd.missing{color:var(--warn);font-weight:600}
.finish-box{background:#fff;border:1.5px solid #A9DCBD;border-radius:var(--radius);padding:18px;margin-top:16px}
.finish-box .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:10px}

/* 專業端 */
.probar{position:sticky;top:57px;z-index:20;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;margin-bottom:16px;display:grid;gap:10px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{min-height:40px;border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 16px;font-weight:700;color:var(--muted);cursor:pointer}
.tabs button[aria-selected="true"]{border-color:var(--blue);color:var(--blue);background:var(--pale2)}
.pb-row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.pb-row select{min-height:40px;border:1.5px solid var(--line);border-radius:10px;padding:4px 10px;background:#fff;max-width:100%}
.pb-row textarea{flex:1 1 240px;min-height:40px;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;resize:vertical}
.pb-case{font-weight:700;color:var(--blue)}
.pro{display:grid;grid-template-columns:190px minmax(0,1fr);gap:20px;align-items:start}
.pro-nav{position:sticky;top:240px;display:flex;flex-direction:column;gap:4px}
.pro-nav a{display:block;padding:8px 12px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:14.5px;border:1px solid transparent}
.pro-nav a:hover{background:var(--pale2);color:var(--blue)}
.pro-main{min-width:0}
.u-summary{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 18px;margin-bottom:16px}
.u-summary > summary{cursor:pointer;font-weight:700;color:var(--blue);font-size:16px;padding:4px 0}
.u-summary .us-sec{margin-top:10px}
.u-summary .us-sec h4{margin:0 0 4px;color:var(--sky);font-size:14.5px}
.u-summary .kv{background:var(--gray);border-radius:8px;padding:8px 10px}
.rules-card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 18px;margin-bottom:16px}
.rules-card h3{margin:0 0 4px;font-size:16px;color:var(--blue)}
.accept-lines{margin:6px 0 0;padding-left:0;list-style:none}
.accept-lines li{font-size:14px;padding:5px 10px;border-radius:8px;margin-bottom:3px;color:var(--muted)}
.accept-lines li[data-active="true"]{background:var(--green-bg);color:var(--ink);font-weight:600;border-left:4px solid var(--green)}
.pro-sec{margin-bottom:22px;scroll-margin-top:240px}
.pro-sec h2{font-size:19px;color:var(--blue);margin:0 0 2px}
.pro-sec .sec-intro{margin:0 0 10px;color:var(--muted);font-size:14px}
.pro-sec .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 12px}
.pro-sec .field{background:var(--gray);border-color:#E1E6EB;padding:12px 14px}
.pro-sec .field.wide{grid-column:1/-1}
.pro-sec .chip{min-height:42px;padding:7px 12px 7px 10px}
.pro-sec .inp{background:#fff}

/* 對話框、提示 */
.modal{position:fixed;inset:0;background:rgba(30,40,50,.35);z-index:60;display:flex;align-items:center;justify-content:center;padding:16px}
.modal-box{background:#fff;border-radius:var(--radius);max-width:640px;width:100%;padding:18px 20px;max-height:90vh;overflow:auto}
.modal-box h3{margin:0 0 6px;color:var(--blue)}
.modal-box textarea{width:100%;min-height:280px;border:1.5px solid var(--line);border-radius:10px;padding:10px;font-size:14.5px}
.modal-box .row{display:flex;gap:10px;justify-content:flex-end;margin-top:10px;flex-wrap:wrap}
.toast{position:fixed;left:50%;top:76px;bottom:auto;transform:translateX(-50%);background:#fff;color:var(--ink);border:1px solid var(--line);border-left:5px solid var(--sky);box-shadow:0 6px 20px rgba(0,0,0,.12);border-radius:10px;padding:10px 16px;z-index:80;max-width:min(560px,calc(100vw - 32px));font-size:15px}
.toast.warn{border-left-color:var(--warn)}
.toast.good{border-left-color:var(--green)}
.toast .t-x{float:right;margin:-4px -8px 0 10px;min-width:32px;min-height:32px;border:0;background:none;color:var(--muted);font-size:18px;cursor:pointer}

/* 白話提示（使用單位） */
.explain{font-size:14.5px;color:var(--ink);background:var(--pale2);border-radius:8px;padding:8px 12px;margin:0 0 10px}
.chip .c-txt{display:flex;flex-direction:column;min-width:0}
.chip .c-sub{font-size:13px;font-weight:400;color:var(--muted);line-height:1.45;margin-top:2px}
.chip.on .c-sub{color:var(--ink)}
.flex-row{margin-top:10px}
.numwarn{display:none;font-size:14px;color:var(--warn);margin-top:6px}
.numwarn.on{display:block}
.req.soft{color:var(--sky);border-color:#9CCFEA}
.sub-off{display:none!important}
.step-miss{background:var(--warn-bg);border:1px solid #F2C9BF;border-radius:10px;padding:10px 14px;margin-top:14px;color:var(--ink);font-size:15px}
.step-miss b{color:var(--warn)}
#btnNext.skip{background:#fff;color:var(--warn);border-color:#EBB5A8}
.home-start{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:18px 22px;margin-bottom:16px}
.home-start h1{margin:0 0 6px;font-size:24px;color:var(--blue);line-height:1.35}
.home-start ol{margin:8px 0 0;padding-left:22px}
.home-start li{margin:2px 0}
.home-more{margin-top:20px;background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:10px 18px}
.home-more > summary{cursor:pointer;font-weight:700;color:var(--blue);min-height:44px;display:flex;align-items:center}
.home-more .hero{border:0;padding:6px 0 0}
.p-todo{background:var(--green-bg);border-radius:10px;padding:10px 12px;margin:0 0 10px;font-size:14.5px}
.p-todo b{color:#00692C}
.p-todo ol{margin:4px 0 0;padding-left:20px}
.p-law{border-top:1px solid var(--line);padding:10px 0}
.p-law .pl-h{font-weight:700;font-size:14.5px}
.p-law ul{margin:4px 0 0;padding-left:18px;font-size:14px}
.p-more{margin-top:8px}
.p-more > summary{cursor:pointer;color:var(--blue);font-weight:600;min-height:44px;display:flex;align-items:center;font-size:14.5px}
.predict-close{display:none}
.predict-mask{display:none}
.done-box{background:#fff;border:1.5px solid #A9DCBD;border-radius:var(--radius);padding:20px}
.done-box h2{margin:0 0 6px;color:#00692C;font-size:22px;display:flex;align-items:center;gap:10px}
.done-box h2 .ok{flex:none;width:30px;height:30px;border-radius:50%;background:var(--green);color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:18px}
.done-box .fname{font-weight:700;word-break:break-all}
.done-box ol{padding-left:22px}
.done-box ol li{margin:6px 0}
.done-box .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.cost-check{font-size:14px;margin-top:6px}
.cost-check.warn{color:var(--warn)}

/* 流程進度軌（三畫面共用） */
.ftrack{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px 14px;margin-bottom:16px}
.ft-head{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap}
.ft-title{font-weight:700;color:var(--blue);font-size:15px;flex:none}
.ft-now{font-size:14.5px;min-width:0}
.ft-now b{color:var(--blue)}
.ft-now.ret b{color:var(--warn)}
.ft-legend{margin-left:auto;display:flex;gap:4px 12px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.ft-legend span{display:inline-flex;align-items:center;gap:5px}
.ft-legend .fn-ic{width:16px;height:16px;font-size:10px;border-width:1.5px}
.ft-toggle{display:none}
.ft-nodes{list-style:none;margin:10px 0 0;padding:0;display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:8px}
.ft-nodes li{min-width:0;position:relative;display:flex}
.ft-nodes li + li::before{content:"";position:absolute;left:-8px;top:21px;width:8px;height:2px;background:var(--line)}
.fnode{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:3px;text-align:left;border:1.5px solid var(--line);border-radius:10px;background:#fff;padding:8px 9px;cursor:pointer;min-height:44px;color:var(--ink);font-size:13px}
.fnode:hover{border-color:var(--sky)}
.fnode[aria-expanded="true"]{border-color:var(--blue);box-shadow:0 0 0 3px var(--pale)}
.fn-top{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fn-ic{flex:none;width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;border:2px solid #B9C2CB;background:#fff;color:#fff;line-height:1;position:relative}
.fn-id{font-weight:700;font-size:13px;color:var(--sky)}
.fn-name{font-weight:700;font-size:13.5px;line-height:1.35}
.fn-meta{font-size:12px;color:var(--muted);line-height:1.35}
.fn-cur{display:inline-block;font-size:11.5px;font-weight:700;color:var(--blue);background:var(--pale);border-radius:999px;padding:0 7px;white-space:nowrap}
[data-fstate="done"] .fn-ic,.fn-ic.done{background:var(--green);border-color:var(--green)}
[data-fstate="doing"] .fn-ic,.fn-ic.doing{background:var(--blue);border-color:var(--blue)}
[data-fstate="doing"] .fn-ic::after,.fn-ic.doing::after{content:"";width:8px;height:8px;border-radius:50%;background:#fff}
[data-fstate="skip"] .fn-ic,.fn-ic.skip{border-color:#CDD4DB;background:linear-gradient(135deg,#fff 44%,#CDD4DB 44%,#CDD4DB 56%,#fff 56%)}
[data-fstate="returned"] .fn-ic,.fn-ic.returned{background:var(--warn);border-color:var(--warn)}
.fnode[data-fstate="done"]{border-color:#A9DCBD;background:#F5FBF7}
.fnode[data-fstate="done"] .fn-meta{color:#00692C}
.fnode[data-fstate="doing"]{border-color:var(--blue);background:var(--pale2)}
.fnode[data-fstate="doing"] .fn-meta{color:var(--blue);font-weight:600}
.fnode[data-fstate="skip"]{border-style:dashed;background:#F8F9FA;color:#8A949E}
.fnode[data-fstate="skip"] .fn-id,.fnode[data-fstate="skip"] .fn-meta{color:#9AA3AC}
.fnode[data-fstate="returned"]{border-color:#EBB5A8;background:var(--warn-bg)}
.fnode[data-fstate="returned"] .fn-meta{color:var(--warn);font-weight:600}
.fst{display:inline-block;font-size:12.5px;font-weight:700;border-radius:999px;padding:1px 10px;white-space:nowrap;background:var(--no-bg);color:#6F7A85}
.fst[data-fstate="done"]{background:var(--green-bg);color:#00692C}
.fst[data-fstate="doing"]{background:var(--blue);color:#fff}
.fst[data-fstate="skip"]{background:#F2F4F6;color:#9AA3AC}
.fst[data-fstate="returned"]{background:var(--warn-bg);color:var(--warn)}
.fdetail{margin-top:12px;border:1.5px solid #BFD9EE;border-radius:10px;padding:14px 16px;background:#FBFDFF}
.fd-head{display:flex;align-items:center;gap:6px 10px;flex-wrap:wrap}
.fd-head h3{margin:0;font-size:17px;color:var(--blue)}
.fd-close{margin-left:auto}
.fd-note{margin:8px 0 0;font-size:14px;padding:8px 12px;border-radius:8px;background:var(--pale2)}
.fd-note.warn{background:var(--warn-bg);color:var(--warn)}
.fd-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 24px;margin-top:10px}
.fd-blk{min-width:0}
.fd-blk h4{margin:0 0 4px;font-size:13.5px;color:var(--sky)}
.fd-blk p{margin:0;font-size:14px}
.fd-list{list-style:none;margin:0;padding:0;display:grid;gap:5px}
.fd-list li{font-size:14px;display:flex;gap:4px 8px;align-items:flex-start;flex-wrap:wrap;min-width:0}
.fd-list li.off{color:#9AA3AC}
.fd-mk{flex:none;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;margin-top:3px}
.fd-mk.ok{background:var(--green);color:#fff}
.fd-mk.pend{background:var(--sky-bg);border:1.5px solid var(--sky);color:var(--sky);font-size:10px}
.fd-pend{font-size:12.5px;color:#00669C;background:var(--sky-bg);border-radius:6px;padding:0 8px}
.fd-go.pend{border-color:#9CCFEA;color:var(--sky)}
.fd-confirm{margin-top:8px}
.fd-mk.no{background:#fff;border:1.5px solid var(--warn);color:var(--warn)}
.fd-link{background:none;border:0;padding:0;color:var(--blue);text-decoration:underline;cursor:pointer;font:inherit;text-align:left;min-height:28px}
.fd-go{min-height:30px;padding:0 10px;border-radius:999px;border:1.5px solid #EBB5A8;background:#fff;color:var(--warn);font-size:13px;font-weight:600;cursor:pointer}
.fd-sw{font-size:12px;color:#9A5B00;background:#FFF4E0;border-radius:999px;padding:0 8px;white-space:nowrap}
.ftag{display:inline-block;font-size:12px;font-weight:600;border-radius:999px;padding:0 8px;white-space:nowrap}
.ftag.need{background:var(--green-bg);color:#00692C}
.ftag.noneed{background:var(--no-bg);color:#8A949E}
.ftag.pend{background:var(--sky-bg);color:var(--sky)}
.ftag.code{background:#fff;border:1px solid #BFD9EE;color:var(--blue)}
.f-when{font-size:12.5px;color:var(--muted)}
.field.flash{box-shadow:0 0 0 3px var(--sky);border-color:var(--sky)}
.stage-tag{display:inline-block;margin-left:8px;font-size:12.5px;font-weight:700;color:var(--sky);background:var(--sky-bg);border-radius:999px;padding:1px 10px;vertical-align:3px}
.status-warn{background:#FFF8EC;border:1px solid #F0D3A4;color:#7A4A00;border-radius:10px;padding:8px 12px;font-size:14px}
.pb-now b{color:var(--blue)}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* 首頁：流程 × 表單對照表 */
.ftable{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--line);font-size:14px}
.ftable th,.ftable td{border-top:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
.ftable th{background:var(--pale2);color:var(--blue);font-size:13.5px;white-space:nowrap}
.ftable ul{margin:0;padding-left:16px}
.ftable li{margin:1px 0}
.ftable .fid{font-weight:700;color:var(--sky);margin-right:4px}
.ftable .cond{display:inline-block;margin-left:4px;font-size:12px;color:var(--sky);border:1px solid var(--sky);border-radius:999px;padding:0 7px}
.ftable .ok{color:var(--green);font-weight:700}
.ftable .no{color:var(--warn);font-weight:700}
.ftable .sub{display:block;font-size:12.5px;color:var(--muted)}
.ftable tr[data-current="true"] td{background:#F4F9FD}

@media (max-width:860px){
  .topbar{padding:8px 16px;gap:8px}
  .topbar .logo{height:26px}
  .tb-title{order:3;flex-basis:100%}
  .form-name{font-size:15px}
  .tb-actions{margin-left:auto}
  main{padding:14px 16px 96px}
  .hero{padding:18px 16px}
  .hero h1{font-size:21px}
  .flow{flex-direction:column}
  .flow li{display:grid;grid-template-columns:auto 1fr;column-gap:10px}
  .flow li .fid{grid-row:1/3}
  .cards{grid-template-columns:minmax(0,1fr)}
  .role-card{min-height:0}
  .wiz{grid-template-columns:minmax(0,1fr)}
  .predict{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:40;border-radius:14px 14px 0 0;max-height:none;padding:0;box-shadow:0 -4px 16px rgba(0,0,0,.10)}
  .predict-toggle{display:flex;width:100%;align-items:center;gap:8px;min-height:44px;padding:6px 16px;background:#fff;border:0;border-radius:14px 14px 0 0;cursor:pointer;text-align:left}
  .predict-mask{position:fixed;inset:0;background:rgba(30,40,50,.35);z-index:35}
  .predict.open + .predict-mask, .predict-mask.on{display:block}
  .predict-close{display:flex;justify-content:flex-end;padding:8px 0 0}
  .predict-toggle .pt-open{flex:none;font-size:13px;color:var(--blue);font-weight:600}
  .toast{left:16px;right:16px;top:12px;bottom:auto;transform:none;max-width:none}
  .btn.sm{min-height:44px}
  .stepper{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px;-webkit-overflow-scrolling:touch}
  .stepper button{flex:none;min-height:44px;padding:4px 14px;font-size:14px}
  .home-start{padding:16px}
  .home-start h1{font-size:21px}
  .predict-toggle .pt-t{font-weight:700;color:var(--blue);flex:none}
  .predict-toggle .pt-brief{flex:1;min-width:0;font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .predict-body{display:none;max-height:62vh;overflow:auto;padding:0 16px 14px}
  .predict.open .predict-body{display:block}
  .predict.open .chev{transform:rotate(180deg)}
  .predict h3.pb-h{display:none}
  .field{padding:14px}
  .chip{width:100%}
  .wiz-nav .btn{flex:1 1 0}
  .kv{grid-template-columns:minmax(0,1fr)}
  .kv dt{margin-top:6px}
  .pro{grid-template-columns:minmax(0,1fr)}
  .pro-nav{position:static;flex-direction:row;overflow-x:auto;gap:6px;padding-bottom:4px}
  .pro-nav a{flex:none;border-color:var(--line);background:#fff;padding:6px 12px}
  .probar{position:static}
  .pro-sec{scroll-margin-top:70px}
  .pro-sec .grid{grid-template-columns:minmax(0,1fr)}
  .num-wrap{max-width:none}
  .ftrack{padding:10px 12px 12px}
  .ft-legend{display:none}
  .ft-title{display:none}
  .ft-head{flex-wrap:nowrap}
  .ft-now{flex:1 1 auto;font-size:14px}
  .ft-toggle{display:inline-flex;margin-left:auto;flex:none;padding:4px 12px}
  .ftrack:not(.open) .ft-nodes{display:none}
  .ft-nodes{display:flex;overflow-x:auto;gap:8px;padding-bottom:6px;-webkit-overflow-scrolling:touch}
  .ft-nodes li{flex:none;width:138px}
  .ft-nodes li + li::before{display:none}
  .fd-grid{grid-template-columns:minmax(0,1fr)}
  .fdetail{padding:12px}
  #flowOverview{display:flex;flex-direction:column}
  .ftable,.ftable tbody,.ftable tr,.ftable td{display:block;width:100%}
  .ftable{border:0;background:transparent}
  .ftable thead{display:none}
  .ftable tr{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;background:#fff;padding:6px 0}
  .ftable td{border:0;padding:3px 12px}
  .ftable td::before{content:attr(data-th);display:block;font-size:12px;color:var(--muted);font-weight:600}
}

/* ───── 列印 ───── */
#print{display:none}
@page{size:A4;margin:10mm 11mm}
@media print{
  html,body{background:#fff!important}
  #app,#toast,#eipModal{display:none!important}
  #print{display:block!important}
}
#print{font-family:var(--font);color:var(--ink);font-size:9.5pt;line-height:1.45;-webkit-print-color-adjust:exact;print-color-adjust:exact}
#print .pt{width:100%;border-collapse:collapse}
#print .pt + .pt{break-before:page}
#print .pt > thead td, #print .pt > tfoot td{padding:0}
#print .ph{display:flex;align-items:center;gap:4mm;border-bottom:0.8pt solid var(--blue);padding-bottom:2mm;margin-bottom:3mm}
#print .ph img{height:8mm;width:auto;flex:none}
#print .ph .ph-t{flex:1;min-width:0}
#print .ph .ph-n{font-size:13pt;font-weight:700;color:var(--blue)}
#print .ph .ph-s{font-size:8pt;color:#666}
#print .ph .ph-r{font-size:8.5pt;text-align:right;flex:none;max-width:65mm}
#print .pf{border-top:0.6pt solid var(--line);margin-top:3mm;padding-top:1.5mm;font-size:7.5pt;color:#777;display:flex;justify-content:space-between}
#print .p-notes{margin:0 0 3mm;padding:2mm 3mm 2mm 7mm;background:var(--pale2);border-radius:2mm;font-size:8.5pt}
#print .p-role-h{font-size:11.5pt;font-weight:700;color:var(--blue);background:var(--pale2);border-left:2mm solid var(--sky);padding:1.6mm 3mm;margin:0 0 2.5mm}
#print .p-role-h small{font-weight:400;color:#555;font-size:8.5pt;margin-left:3mm}
#print h3.p-sec-h{font-size:10.5pt;color:var(--blue);margin:3mm 0 1.2mm;break-after:avoid}
#print h3.p-sec-h small{font-weight:400;color:#777;font-size:8pt;margin-left:2mm}
#print table.ps{width:100%;border-collapse:collapse;table-layout:fixed}
#print table.ps th,#print table.ps td{border:0.6pt solid #A9B8C7;padding:1.1mm 2mm;vertical-align:top;text-align:left}
#print table.ps th{width:31%;background:var(--pale2);font-weight:600;color:var(--ink)}
#print table.ps td{height:7mm;background:#fff}
#print .gray table.ps td{background:#EFEFEF}
#print table.ps tr{break-inside:avoid}
#print tr.off th,#print tr.off td{color:#B5B5B5}
#print .cond{display:block;font-size:7.5pt;color:#888;font-weight:400}
#print .reqm{color:var(--warn)}
#print .ref{font-size:7pt;color:#888;font-weight:400}
#print .opt{display:inline-block;margin-right:3.5mm;white-space:nowrap}
#print .box{font-family:"Segoe UI Symbol","Apple Symbols",var(--font)}
#print .blank-line{display:inline-block;min-width:22mm;border-bottom:0.6pt solid #888;height:4mm;vertical-align:bottom}
#print table.pm{width:100%;border-collapse:collapse;table-layout:fixed}
#print table.pm td,#print table.pm th{border:0.5pt solid #BFC9D3;padding:1mm 1.5mm;font-size:8.5pt;background:transparent}
#print table.pm th{background:transparent;font-weight:600}
#print .sig-grid{display:grid;grid-template-columns:1fr 1.6fr 1fr;gap:3mm;align-items:end}
#print .sig-cell{min-height:14mm;display:flex;flex-direction:column;justify-content:flex-end}
#print .sig-cell img{max-height:14mm;max-width:100%;width:auto;align-self:flex-start}
#print .sig-line{border-bottom:0.8pt solid #333;min-height:6mm;display:flex;align-items:flex-end;padding-bottom:0.5mm}
#print .sig-cap{font-size:7.5pt;color:#777}
#print .p-sys{margin-top:2mm;font-size:8.5pt;border:0.6pt dashed #A9B8C7;padding:2mm 3mm}
#print .p-sys .act{font-weight:700}
#print table.pfl{width:100%;border-collapse:collapse;table-layout:fixed}
#print table.pfl th,#print table.pfl td{border:0.6pt solid #A9B8C7;padding:1.1mm 2mm;vertical-align:top;text-align:left;font-size:8.5pt}
#print table.pfl th{background:var(--pale2);font-weight:600}
#print table.pfl tr{break-inside:avoid}
#print table.pfl .st-done{color:#00692C;font-weight:700}
#print table.pfl .st-doing{color:var(--blue);font-weight:700}
#print table.pfl .st-returned{color:var(--warn);font-weight:700}
#print table.pfl .st-skip{color:#999}
#print .stg{font-size:8pt;color:var(--sky);font-weight:600;margin-left:2mm}
</style>
</head>

   "id": "R_CLASS",
   "name": "工程類別預判",
   "when": "金額依序取 awardAmt（決標）→ estTotal（工務處初估）→ budgetRange（使用單位預估）",
   "logic": [
    "reqType 只勾「修繕或更換故障設施」且金額 ≦10 萬 → 不列入工程（走設備請修 61-P-001）",
    "≦100 萬 → 小型營繕工程（§5.3.2.3「不超過 100 萬元」）",
    ">100 萬且 ≦1,000 萬 → 中型工程",
    ">1,000 萬 → 大型工程；新建建築需委託建築師者由工務處直接判大型",
    "金額未知但 touches 含「拆牆、新增或移動隔間」且同時動到空調、消防、給排水或用電 → 提示「可能需設計規劃（中型）」，由工務處判定，不自動改類別",
    "budgetRange = 不知道 → 待工務處會勘判定"
   ],
   "sopRef": "§5.3.2",
   "audience": "U,E",
   "note": "剛好 100 萬：依程序書文字屬小型（≦100 萬），但合約書（§5.10.1）與驗收簽核（§5.13.4.1）門檻為「100 萬以上」，仍須簽約並走 ≧100 萬簽核流程。"

   "logic": [
    "<8 萬：工務處 → 使用單位（人員／主管）→ 採購部門請款",
    "8–20 萬：工務處 → 使用單位 → 會驗（採購／資訊／相關部門）→ 協驗（院區規劃管理中心，經立案者）→ 核決（處／部長）→ 採購請款",

   ],
   "sopRef": "§5.13.4.1",
   "audience": "P"
  }

      f4Date: D(-6), f4Result: O('f4Result', '同意'), f4Approver: '（虛構）門診部主任', f4Note: '同意，例假日施工。',
      designMeeting: D(-4), designCheck: OS('designCheck', ['電源與插座']),
      designSigned: O('designSigned', '已簽認'), facilityConfirm: O('facilityConfirm', '已簽核'), bidListReview: O('bidListReview', '已完成'),
      awardAmt: 18, quoteCount: O('quoteCount', '二家以上'),
      acceptDocs: OS('acceptDocs', ['材料', '保固書', '施工前中後']),
      warranty: { '土建': 1, '機電': 1, '設備': null },
      assetCheck: O('assetCheck', '否'), coInspect: [],
      pNote: '二家報價，決標 18 萬元；未達 100 萬免簽工程合約書，工期未達 2 週免進度表。', pSign: sig('張 PCM', -2),
    });
  }

  const U_DONE = ROLES.U.name + '完成填報並下載案件檔（送' + ROLES.E.name + '）';
  const H = (role, action, time, note) => note ? { role: role, action: action, time: time, note: note } : { role: role, action: action, time: time };
  const histBig = () => [
    H('U', U_DONE, T(-18, '10:20')),
    H('E', '工務處開啟案件檔', T(-15, '09:05')),
    H('E', FL('F2'), T(-15, '09:06')),
    // ↑ (b) 到此
    H('E', '會勘完成：工程類別、法規、感控、容量判定與費用初估（初估 160 萬元、工期 30 日）', T(-10, '16:40')),
    H('E', FL('F3'), T(-10, '16:45')),
    H('E', '工務處下載案件檔（交接）', T(-10, '16:46')),
    // ↑ (c) 到此
    H('E', '院區規劃管理中心審核通過（工務處登錄於 X3）', T(-7, '11:10'), '送審原因：委外設計（需設計師提供設計圖）'),
    H('E', FL('F4'), T(-7, '11:12')),
    // ↑ (c) 到此
    H('E', '核決主管核准（工務處登錄於 X4）', T(-6, '15:30')),
    H('P', 'PCM 開啟案件檔', T(-5, '09:00')),
    H('P', FL('F5'), T(-5, '09:01')),
    H('P', '設計確認會議完成，使用單位最高主管已於設計圖簽認', T(-3, '14:20')),
    H('P', FL('F6'), T(-1, '10:00')),
    H('P', '詢議價完成，登錄決標金額 148 萬元', T(-1, '10:05')),
    // ↑ (d) 到此
    H('P', FL('F7'), T(2, '09:00')),
    H('P', '專案協調會完成；承攬商安全衛生承諾書與危害因素告知單已繳交', T(2, '11:00')),
    H('P', 'EIP 全院公告並通知職安中心與鄰近單位；前一日張貼施工告示與圍籬', T(9, '17:00')),
    H('P', '開工（夜間施工）', T(12, '20:00')),
    // ↑ (e) 到此
    H('P', '完工，廠商提出工程完工證明書', T(40, '08:30')),
    H('P', FL('F8'), T(40, '09:00')),
    H('P', '初驗合格，工程完工驗收紀錄表簽核完成', T(43, '15:00')),
    H('P', '點交／移交完成（工程點交／移交清冊）', T(50, '10:00')),
    H('P', '已送採購部門請款', T(52, '10:00')),
  ];
  const histSmall = () => [
    H('U', U_DONE, T(-9, '14:00')),
    H('E', FL('F2'), T(-8, '09:30')),
    H('E', '會勘完成：小型營繕、初估 19 萬元、工期 4 日；不需送院區規劃管理中心', T(-7, '11:00')),
    H('E', FL('F4'), T(-7, '11:05')),
    H('E', '核決主管核准（工務處登錄於 X4）', T(-6, '16:00')),
    H('P', FL('F5'), T(-5, '09:00')),
    H('P', FL('F6'), T(-2, '10:00')),
    H('P', '詢議價完成，登錄決標金額 18 萬元', T(-2, '10:10')),
  ];

  const SCEN = [
    { id: 'blank', label: '(a) 空白開始', title: '使用單位從頭填寫', role: 'U' },
    { id: 'f2', label: '(b) 已送出・待會勘', title: '使用單位已填完並簽名，待工務處會勘（F2）', role: 'E', status: 'F2', answers: () => bigU(), hist: 3 },
    { id: 'f3', label: '(c) 工務處已判定', title: '工務處已判定、院區規劃管理中心審核通過（F3 完成），待核決（F4）', role: 'E', status: 'F4', confirm: ['E'], answers: () => Object.assign(bigU(), bigE(), bigX3()), hist: 8 },
    { id: 'f6', label: '(d) 標單完成', title: 'PCM 設計確認與標單完成（F6 已完成），待施工（F7 未開始），可看驗收簽核流程', role: 'P', status: 'F6', confirm: ['E', 'P'], answers: () => Object.assign(bigU(), bigE(), bigX3(), bigX4(), bigP()), hist: 14 },
    { id: 'f7', label: '(e) 施工中', title: '已公告、已開工、尚未完工（F7 進行中）', role: 'P', status: 'F7', shift: -20, confirm: ['E', 'P'], answers: () => Object.assign(bigU(), bigE(), bigX3(), bigX4(), bigP(), bigX7(false)), hist: 18 },
    { id: 'f8', label: '(f) 驗收結案', title: '驗收合格、點交並送請款（F1–F8 全部完成）', role: 'P', status: 'F8', shift: -60, confirm: ['E', 'P'], answers: () => Object.assign(bigU(), bigE(), bigX3(), bigX4(), bigP(), bigX7(true), bigX8()), hist: 23 },
    { id: 'small', label: '對照：小案約 20 萬', title: '門診 2F 換地板與插座：小型、F3 不需走、免合約、驗收 8–20 萬（F6 已完成）', role: 'P', status: 'F6', confirm: ['E', 'P'], answers: smallAll, history: histSmall },
  ];
  let curScen = null;

  function clearDemoStorage() {
    try {
      const ks = [];
      for (let i = 0; i < localStorage.length; i++) { const k = localStorage.key(i); if (k && k.indexOf(DM_PREFIX) === 0) ks.push(k); }
      ks.forEach(k => localStorage.removeItem(k));
    } catch (e) {}
  }
  function loadScenario(id) {
    const sc = SCEN.find(x => x.id === id); if (!sc) return;
    $('#eipModal').hidden = true;
    if (id === 'blank') {
      try { localStorage.removeItem(LS_KEY); } catch (e) {}
      state = freshState(); curScen = id;
      syncAll(); renderPrint();
      setMode('U');
      toast('已載入情境 ' + sc.label + '：' + sc.title + '。', 'good');
      return;
    }
    shift = sc.shift || 0;
    const ans = sc.answers(), hist = sc.history ? sc.history() : histBig().slice(0, sc.hist);
    shift = 0;
    loadCaseObj({
      answers: ans, manual: {}, auto: {}, flags: {}, legacy: {},
      history: hist, status: sc.status, returned: null, step: STEPS, sub: 0,
    });
    curScen = id;
    syncAll(); renderPrint(); saveDraft();
    setMode(sc.role);
    // 已判定過的情境：工務處／PCM 已確認系統預標（(b) 待會勘維持「預標待確認」）
    if (sc.confirm) {
      SCHEMA.sections.filter(x => sc.confirm.includes(x.role)).forEach(x => x.fields.forEach(f => {
        if (!f.derivedHint) return;
        (f.type === 'matrix' ? f.rows.map(r => f.id + '.' + r.id) : [f.id]).forEach(k => { if (state.auto[k]) state.manual[k] = true; });
      }));
      refresh();
    }
    saveDraft();
    toast('已載入情境 ' + sc.label + '：' + sc.title + '。', 'good');
  }
  function demoRole(r) {
    if (r !== 'U' && !hasCase()) { loadScenario(r === 'E' ? 'f3' : 'f6'); return; }
    setMode(r);
  }
  function resetDemo() {
    clearDemoStorage();
    $('#eipModal').hidden = true;
    state = freshState(); curScen = null;
    syncAll(); renderPrint();
    setMode('home');
    toast('已重置 Demo：範例資料與本機草稿皆已清空。', 'good');
  }

  /* ── 控制列 ── */
  const DM_CSS = [
    '.demo-bar{background:#F3F8FC;border-bottom:1px solid var(--line)}',
    '.demo-bar .db-in{max-width:1180px;margin:0 auto;padding:8px 24px;display:flex;flex-direction:column;gap:6px}',
    '.demo-bar .db-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;min-width:0}',
    '.demo-bar .db-tag{display:inline-block;border:1.5px solid var(--green);color:var(--green);background:#fff;border-radius:999px;padding:1px 12px;font-weight:700;font-size:14px}',
    '.demo-bar .db-cur{font-size:13.5px;color:var(--muted);min-width:0}',
    '.demo-bar .db-cur b{color:var(--blue)}',
    '.demo-bar .db-lab{font-size:13px;color:var(--muted);font-weight:600;margin-right:2px}',
    '.demo-bar .db-btn{min-height:34px;padding:3px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--blue);font-weight:600;font-size:14px;cursor:pointer;line-height:1.3}',
    '.demo-bar .db-btn:hover{border-color:var(--sky)}',
    '.demo-bar .db-btn[aria-pressed="true"]{background:var(--pale);border-color:var(--blue)}',
    '.demo-bar .db-btn.reset{color:var(--warn);border-color:#F2C9BF;margin-left:auto}',
    '.demo-guide{background:#fff;border:1.5px solid var(--sky);border-radius:var(--radius);padding:16px 22px;margin-top:16px}',
    '.demo-guide h2{margin:0 0 6px;font-size:18px;color:var(--blue)}',
    '.demo-guide ol{margin:0;padding-left:22px}',
    '.demo-guide li{margin:8px 0;font-size:14.5px}',
    '.demo-guide li .btn{margin-left:6px;vertical-align:middle}',
    '.demo-guide .help{margin:8px 0 0}',
    '#print .demo-stamp{color:#C23B22;font-weight:700;font-size:8pt}',
    '@media (max-width:600px){.demo-bar .db-in{padding:8px 16px}.demo-bar .db-btn{font-size:13px;padding:3px 10px}.demo-guide{padding:14px 16px}.demo-bar .db-btn.reset{margin-left:0}}',
  ].join('\n');

  function mountBar() {
    document.head.append(h('style', { id: 'demoCss', text: DM_CSS }));
    const bar = h('div', { id: 'demoBar', class: 'demo-bar', role: 'region', 'aria-label': 'Demo 控制列' }, h('div', { class: 'db-in' },
      h('div', { class: 'db-row' },
        h('span', { class: 'db-tag', id: 'demoTag', text: 'Demo 示範版｜所有資料皆為虛構範例' }),
        h('span', { class: 'db-cur', id: 'demoCur' }),
        h('button', { type: 'button', class: 'db-btn reset', id: 'demoReset', text: '重置 Demo', onclick: resetDemo })),
      h('div', { class: 'db-row', role: 'group', 'aria-label': '切換角色' },
        h('span', { class: 'db-lab', text: '切換角色' }),
        ['U', 'E', 'P'].map(r => h('button', { type: 'button', class: 'db-btn', dataset: { demoRole: r }, 'aria-pressed': 'false', text: roleShort(r), onclick: () => demoRole(r) }))),
      h('div', { class: 'db-row', role: 'group', 'aria-label': '載入情境' },
        h('span', { class: 'db-lab', text: '載入情境' }),
        SCEN.map(sc => h('button', { type: 'button', class: 'db-btn', dataset: { demoScen: sc.id }, 'aria-pressed': 'false', title: sc.title, text: sc.label, onclick: () => loadScenario(sc.id) })))));
    $('#topbar').after(bar);
  }
  function renderBar() {
    const cur = $('#demoCur'); if (!cur) return;
    const m = state.mode;
    cur.textContent = '';
    cur.append('目前：', h('b', { text: m === 'home' ? '首頁' : roleShort(m) }),
      hasCase() ? '｜站點 ' + flowNowText(flowStatus(state)) + '｜' + (state.answers.projName || '未命名案件') : (m === 'U' ? '｜空白新案' : ''));
    $$('#demoBar [data-demo-role]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.demoRole === m)));
    $$('#demoBar [data-demo-scen]').forEach(b => b.setAttribute('aria-pressed', String(b.dataset.demoScen === curScen)));
  }

  /* ── 包裝既有函式（只在 Demo 版生效） ── */
  const _setMode = setMode;
  setMode = function (m) { _setMode(m); renderBar(); };
  const _renderProbar = renderProbar;
  renderProbar = function () { _renderProbar(); renderBar(); };
  const _enterRole = enterRole;
  enterRole = function (r) { if (r !== 'U' && !hasCase() && !readDraft()) { demoRole(r); return; } _enterRole(r); };
  const _renderPrint = renderPrint;
  renderPrint = function (opts) {
    _renderPrint(opts);
    $$('#print .ph-r').forEach(x => x.append(h('div', { class: 'demo-stamp', text: 'Demo 示範版｜所有資料皆為虛構範例' })));
  };
  const _renderHome = renderHome;
  renderHome = function () {
    _renderHome();
    const home = $('#home');
    const go = (txt, fn, id) => h('button', { type: 'button', class: 'btn sm', id: id, text: txt, onclick: fn });
    const guide = h('section', { class: 'demo-guide', id: 'demoGuide', 'aria-labelledby': 'demoGuideH' },
      h('h2', { id: 'demoGuideH', text: 'Demo 導覽（建議順序）' }),
      h('ol', {},
        h('li', {}, h('b', { text: '以使用單位身分填：' }), '從空白開始，照 8 個步驟回答；畫面下方「接下來會怎麼走」會依回答即時預判。', go('開始填寫', () => loadScenario('blank'), 'demoGo1')),
        h('li', {}, h('b', { text: '切工務處看預標：' }), '載入透析室擴充案（初估 160 萬），看系統自動預標工程類別、送審、法規、感控、職安、合約與進度表。', go('看工務處判定', () => loadScenario('f3'), 'demoGo2')),
        h('li', {}, h('b', { text: '切 PCM 看驗收流程：' }), '決標 148 萬後，看驗收會驗與簽核鏈、交接紀錄；再依序按「(e) 施工中」「(f) 驗收結案」看流程走完，或按「對照：小案約 20 萬」比較小型案件（F3 不需走）的路徑。', go('看 PCM 驗收流程', () => loadScenario('f6'), 'demoGo3')),
        h('li', {}, h('b', { text: '列印紙本：' }), '按頁首「列印」看三方合一的紙本（含系統判定與交接紀錄），可另存 PDF。', go('列印目前案件', () => { if (!hasCase()) loadScenario('f6'); doPrint(false); }, 'demoGo4'))),
      h('p', { class: 'help', id: 'demoFlowHint', text: '頁面上方的流程進度軌會依填寫內容即時變化：F1–F8 各站顯示已完成、進行中、未開始或不需走，點任一站可看這一站做什麼、應附表單與完成條件。' }),
      h('p', { class: 'help', text: '頁首下方的 Demo 控制列可隨時切換角色、載入情境或重置。本頁所有人名、分機、成本代碼與 EIP 單號皆為虛構範例；草稿只存在你這台瀏覽器。' }));
    home.insertBefore(guide, home.children[1] || null);
  };
  const _init = init;
  init = function () {
    mountBar();
    _init();
    document.title = '工程規格需求表 Demo 示範版';
    $('#tbSub').textContent = 'Demo 示範版｜版次 ' + META.version + '｜所有資料皆為虛構範例';
    renderBar();
  };
  api.setMode = m => setMode(m);
  api.renderPrint = o => renderPrint(o);
  api.demo = { loadScenario, resetDemo, role: demoRole, lsKey: LS_KEY, scenarios: SCEN.map(x => ({ id: x.id, label: x.label, title: x.title, role: x.role, status: x.status || 'F1' })), get current() { return curScen; } };
}

init();
})();
</script>
</body>
</html>
